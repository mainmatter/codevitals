[package]
name = "codevitals"
version = "0.1.0"
edition = "2024"
description = "Records a git repository's history and the structure of its code into DuckDB, and computes code-health metrics over it in SQL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mainmatter/codevitals"
readme = "README.md"

[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
crossterm = "0.29.0"
duckdb = { version = "1.20000.1", features = ["appender-arrow", "bundled", "json"] }
gix = "0.90.0"
jiff = "0.2.42"
petgraph = { version = "0.8.3", default-features = false }
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "=0.26.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-typescript = "=0.23.2"
unicode-width = "0.2.3"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"

# Tests plan many metric queries, so build DuckDB as in release even in test builds:
# optimized, and without debug info, which libduckdb-sys turns into DuckDB's DEBUG
# mode (internal assertions and verification passes).
[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false

# Parsers are C, compiled at the package's opt-level: unoptimized, a test's first
# parse and query compilation take most of a second.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-c]
opt-level = 3

[profile.dev.package.tree-sitter-cpp]
opt-level = 3

[profile.dev.package.tree-sitter-javascript]
opt-level = 3

[profile.dev.package.tree-sitter-json]
opt-level = 3

[profile.dev.package.tree-sitter-python]
opt-level = 3

[profile.dev.package.tree-sitter-rust]
opt-level = 3

[profile.dev.package.tree-sitter-toml-ng]
opt-level = 3

[profile.dev.package.tree-sitter-typescript]
opt-level = 3
