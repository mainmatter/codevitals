# Releases with release-plz (see release-plz.toml). Each push to main:
# - opens or updates the release PR (version bump + CHANGELOG.md);
# - when that PR is merged, tags vX.Y.Z and creates a draft release with the new
#   changelog section as notes, builds a binary per platform the codevitals action
#   supports (codevitals-<target>.tar.gz), attaches them with build provenance,
#   publishes the release, and moves the floating tag (v0.Y before 1.0, vX after).
#
# The binaries are built in this same run, from release-plz's outputs, because tags
# and releases created with GITHUB_TOKEN do not trigger other workflows. For the same
# reason CI does not run on the release PR itself; it runs on main once the PR is
# merged (a push by whoever merged it).
#
# Actions are pinned to commit SHAs; Renovate bumps them.
name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-pr:
    if: github.repository_owner == 'mainmatter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # Not on the release job: a cancelled run there could drop a release.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    if: github.repository_owner == 'mainmatter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      # Empty when this push released nothing.
      tag: ${{ steps.release-plz.outputs.releases_created == 'true' && fromJSON(steps.release-plz.outputs.releases)[0].tag || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      matrix:
        include:
          # Linux on 22.04: binaries need the glibc they were linked against or newer,
          # so build on the oldest supported image to run on more runners and containers.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit release-plz just released (a draft's tag may not exist yet).
          ref: ${{ github.sha }}
          persist-credentials: false
      # Built with rustup, not in the Nix dev shell: Nix's compilers link against
      # glibc (Linux) and libc++ (macOS) inside /nix/store, so the binary would only
      # run where that exact store path exists. rustup reads the same
      # rust-toolchain.toml, so rustc is the version CI tests with; the C/C++
      # compiler (for DuckDB) is the runner's.
      #
      # No cache either: anything that can write a cache main reads could otherwise
      # plant code in a published binary.
      - run: rustup show && rustup target add "$TARGET"
      - run: cargo build --release --locked --target "$TARGET"
      - id: package
        run: |
          asset="codevitals-$TARGET.tar.gz"
          tar -czf "$asset" -C "target/$TARGET/release" cv -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.asset }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        # --clobber: a re-run of a failed job replaces what an earlier attempt uploaded.
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
      # A floating tag for `uses: mainmatter/codevitals@v0.2` (or @v1 from 1.0): the
      # newest release with no breaking changes from the one it names. Before 1.0 a
      # minor bump is breaking, so the tag covers major.minor, not just major.
      # The released commit is this run's: release-plz tags the commit it was run on.
      - run: |
          IFS=. read -r major minor _ <<< "${TAG#v}"
          floating="v$major"
          [[ "$major" == 0 ]] && floating="v0.$minor"
          # Move the tag, or create it on a new line's first release.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$floating" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$floating" -f sha="$GITHUB_SHA" >/dev/null
          echo "$floating -> $TAG ($GITHUB_SHA)"
